<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster References</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    header {
      text-align: center;
      color: #e0e0e0;
      font-size: 13px;
      letter-spacing: 0.05em;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .pdf-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 0;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.5);
      background: #fff;
    }

    /* Tablet */
    @media (min-width: 600px) {
      .container {
        padding: 16px;
        gap: 12px;
      }

      header {
        font-size: 14px;
      }

      .pdf-wrapper {
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
      }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .container {
        padding: 24px;
        gap: 16px;
      }

      .pdf-wrapper {
        max-width: 1100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>References</header>
    <div class="pdf-wrapper">
      <iframe
        class="pdf-frame"
        src="references.pdf#toolbar=1&navpanes=0&view=FitH"
        title="References PDF">
      </iframe>
    </div>
  </div>
</body>
</html>
