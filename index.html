<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster References</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #525659;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      background: #323639;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    #page-info {
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    #download-btn {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #download-btn:hover { background: rgba(255,255,255,0.25); }

    #viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      gap: 16px;
      overflow-y: auto;
    }

    canvas {
      display: block;
      max-width: 100%;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      border-radius: 2px;
    }

    #status {
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      margin-top: 40px;
      text-align: center;
    }

    #status a {
      color: #7ab8f5;
      text-decoration: underline;
    }

    .page-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <h1>Poster References</h1>
    <span id="page-info"></span>
    <a id="download-btn" href="references.pdf" download>Download PDF</a>
  </div>

  <div id="viewer">
    <div id="status">Loading...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');
    const pageInfo = document.getElementById('page-info');

    function getScale(viewport) {
      const maxWidth = Math.min(window.innerWidth - 32, 1000);
      return maxWidth / viewport.width;
    }

    async function renderPage(pdf, pageNum) {
      const page = await pdf.getPage(pageNum);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = getScale(baseViewport);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas;
    }

    async function renderAll(pdf) {
      viewer.innerHTML = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'page-wrapper';
        const canvas = await renderPage(pdf, i);
        wrapper.appendChild(canvas);
        viewer.appendChild(wrapper);
      }
    }

    let pdfDoc = null;

    pdfjsLib.getDocument('references.pdf').promise.then(pdf => {
      pdfDoc = pdf;
      status.remove();
      const pages = pdf.numPages;
      pageInfo.textContent = pages === 1 ? '1 page' : `${pages} pages`;
      renderAll(pdf);
    }).catch(() => {
      status.innerHTML =
        'Could not load PDF. <a href="references.pdf">Open directly</a>.';
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (pdfDoc) renderAll(pdfDoc); }, 250);
    });
  </script>
</body>
</html>
